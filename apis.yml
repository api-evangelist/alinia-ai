name: Alinia Ai
description: >-
  Alinia is an AI compliance and control platform that helps enterprises deploy
  large language models and AI agents safely and in compliance with regulations,
  making AI systems "compliant by design" through regulation-informed control
  layers. The platform is built around three products: an Evaluation Engine that
  tests AI systems against company policies and regulatory standards (compliance
  red teaming), Guardrails that enforce compliance in real time — including a
  proprietary multilingual RAG Guard model that blocks hallucinations and
  irrelevance — and Monitoring that provides automated auditing, full
  traceability, and compliance reporting of AI activity. Alinia is model-agnostic
  and multilingual, targeting financial services, healthcare, and other heavily
  regulated industries, with named customers including Banco Santander and Origin
  Financial. The company was co-founded by Ariadna (CEO, previously Head of ML
  Platform at Twitter and Director of Development at IBM Watson) and Carlos (COO,
  previously AI Counsel at Hugging Face), operates offices in Barcelona, Valencia,
  New York, and Pittsburgh, and is backed by Speedinvest. Added to the API
  Evangelist network as a portfolio lead; no public API, OpenAPI, or developer
  portal is currently published.
